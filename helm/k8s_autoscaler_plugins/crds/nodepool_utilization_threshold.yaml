apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepoolutlizationthresholds.jupyter.org
spec:
  scope: Cluster
  group: jupyter.org
  names:
    kind: NodepoolUtilizationThreshold
    plural: nodepoolutlizationthresholds
    singular: nodepoolutilizationthreshold
    shortNames:
      - nputs
      - nput
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
      - name: Nodepool
        type: string
        description: Nodepool name
        jsonPath: .spec.nodepoolLabelValue
      - name: State
        type: string
        description: Nodepool utilization threshold state
        jsonPath: .status.state
      - name: Resource
        type: string
        description: Resource type
        jsonPath: .spec.policy.type
      - name: Minimum threshold
        type: number
        description: Minimum utilization threshold to trigger autoscaler down
        jsonPath: .spec.policy.minimumThreshold
      - name: Maximum threshold
        type: number
        description: Minimum utilization threshold to trigger autoscaler up
        jsonPath: .spec.policy.maximumThreshold
      - name: Utilization
        type: number
        description: Current nodepool resource utilization
        jsonPath: .status.utilization